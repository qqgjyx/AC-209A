# environment.yml
name: cs1090a-hw3
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12  # Specify a python version
  - pip         # Make sure pip itself is installed by conda
  - pip:
    # Listed explicitly rather than as `-r requirements.txt`: the Gradescope container
    # does not place requirements.txt next to this file, so a `-r` line breaks its build.
    - numpy>=2.3
    - scipy>=1.16
    - pandas>=3
    - matplotlib>=3.10
    - seaborn>=0.13.2
    - scikit-learn>=1.7
    - otter-grader>=7,<8
    - jupyter>=1.1
    - jupyterlab>=4
    - nbconvert>=7
    - nbformat>=5
    - statsmodels>=0.14.5,<0.15

# CS1090A / AC209A Fall 2026 -- one environment for the whole course.
#
#   uv sync            # build it
#   uv run jupyter lab # work in it
#
# This is the `full` tier of homeworks/cs1090a_hw0/pyproject.toml promoted to the
# repo root, so section notebooks and every homework share a single environment
# instead of one per assignment. The hw0 project file stays as shipped -- it is
# course material, and its three-tier split is part of the assignment.
#
# Upper bounds are carried over from hw0: they keep an autumn release from
# breaking a notebook mid-term.
[project]
name = "ac209a-course"
version = "2026.0"
description = "CS1090A/AC209A Fall 2026 course environment"
requires-python = ">=3.12,<3.14"

dependencies = [
    # core scientific stack + the otter grader and JupyterLab
    "numpy>=2.3,<3",
    "scipy>=1.16,<2",
    "matplotlib>=3.10,<4",
    # Section 02 onward the course requires pandas 3 (sections/sec02 pins
    # >=3,<4). hw0 stays on 2.x through its own pinned project file.
    "pandas>=3,<4",
    "otter-grader>=7,<8",
    "jupyterlab>=4",
    "jupyter>=1.1",
    # analysis
    "seaborn>=0.13.2",
    "scikit-learn>=1.7",
    "statsmodels",
    "tqdm",
    # data I/O and web
    "requests",
    "beautifulsoup4",
    "lxml",
    "httpx>=0.28",
    "aiohttp",
    # Upper bounds match homeworks/cs1090a_hw1, which caps both.
    "pyarrow>=21,<24",
    "openpyxl",
    "duckdb>=1.5",
    "polars>=1.40",
    "plotly>=6,<7",
    # notebook tooling
    "ipywidgets",
    "jupytext",
    "jupyterlab-git",
    "nbdime",
    # modelling and interpretability
    "pymc",
    "arviz",
    "xgboost",
    "imbalanced-learn",
    "lime",
    "wikipedia",
    "prettytable",
    "eli5",
    "dtreeviz",
    # Python binding only. Rendering also needs the Graphviz system package
    # (the `dot` binary): `brew install graphviz`.
    "graphviz",
    # In-notebook coding assistant. Drives the Claude Code CLI, which is not a
    # Python package -- Node and the CLI itself are separate, see
    # homeworks/cs1090a_hw0/SETUP.md.
    "notebook-intelligence>=5.3.1",
    # Pinned by us: NBI asks for `mcp>=1.28.1` uncapped, but mcp 2.0.0 moved
    # FastMCP out of the SDK, so NBI's server extension fails to import while
    # still listing as enabled. Drop once NBI 5.4.0 is stable.
    "mcp>=1.28.1,<2",
]

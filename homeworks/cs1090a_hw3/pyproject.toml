# CS1090A HW3 environment — laptop setup via uv (https://docs.astral.sh/uv/):
#   uv sync            # creates .venv with these pinned-compatible versions
#   uv run jupyter lab
# Upper bounds prevent a mid-semester release from surprising you.
[project]
name = "cs1090a-hw3"
version = "2026.0"
description = "CS1090A Fall 2026 HW3 environment"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.3,<3",
    "scipy>=1.16,<2",
    "pandas>=3,<4",
    "matplotlib>=3.10,<4",
    "seaborn>=0.13.2,<0.14",
    "scikit-learn>=1.7,<2",
    "statsmodels>=0.14.5,<0.15",
    "otter-grader>=7,<8",
    "jupyter>=1.1",
    "jupyterlab>=4",
    "nbconvert>=7",
    "nbformat>=5",
]

# Optional: a coding assistant inside JupyterLab (the notebook-intelligence extension).
# Nothing in this homework needs it, and it adds about 50 more packages, so uv installs
# it only when you ask for it:
#
#   uv sync --extra ai-tools
#
# The assistant works by running the Claude Code command-line program, and this extra
# does not give you a `claude` command. Install it separately
# (curl -fsSL https://claude.ai/install.sh | bash) and check that typing `claude` in a
# terminal starts it before you start JupyterLab.
[project.optional-dependencies]
ai-tools = [
    "notebook-intelligence>=6.1,<7",
]

# CS1090A HW0 environment -- laptop setup via uv (https://docs.astral.sh/uv/):
#
#   uv sync                      # HW0 only -- what this assignment imports
#   uv sync --extra ai-tools     # ...plus the in-notebook coding assistant
#   uv sync --extra full         # ...plus the whole course stack (mirrors FASOnDemand)
#   uv run jupyter lab
#
# Three tiers rather than one list, because a faithful mirror of the FASOnDemand
# environment costs ~2.4G and several minutes on a laptop -- a poor first
# experience for an assignment that ships before the term starts and whose Part 1
# is itself the lesson in building an environment. Students who want parity with
# OnDemand can ask for it; students who just want to do HW0 should not have to
# download CUDA libraries to get there.
#
# Upper bounds keep an autumn release from surprising a student mid-assignment.
[project]
name = "cs1090a-hw0"
version = "2026.0"
description = "CS1090A Fall 2026 HW0 environment"
requires-python = ">=3.12,<3.14"

# What HW0 actually imports: numpy, scipy, pandas, matplotlib -- plus otter for
# the grader.check cells and jupyterlab to run the thing.
dependencies = [
    "numpy>=2.3,<3",
    "scipy>=1.16,<2",
    "matplotlib>=3.10,<4",
    "pandas>=2.3,<3",
    "otter-grader>=7,<8",
    "jupyterlab>=4",
    "jupyter>=1.1",
]

[project.optional-dependencies]
# The coding assistant, in the notebook UI rather than beside it.
#
# INCOMPLETE ON ITS OWN, and deliberately so: notebook-intelligence drives the
# Claude Code CLI, which is not a Python package. Locally you also need Node and
# the CLI itself -- see SETUP.md. On FASOnDemand both are already installed, which
# is much of the reason to use it.
ai-tools = [
    "notebook-intelligence>=5.3.1",
    # Pinned by us, not by notebook-intelligence. NBI 5.3.1 asks for
    # `mcp>=1.28.1` with no upper bound, and mcp 2.0.0 (2026-07-28) moved the
    # FastMCP server out of the SDK -- so `mcp.server.fastmcp` is gone, NBI's
    # server extension fails to import, and the extension installs and lists as
    # enabled while no UI ever appears. Upstream capped it the same way on main
    # and in 5.4.0a1; drop this once 5.4.0 is stable.
    "mcp>=1.28.1,<2",
]

# The rest of the course stack, matching the FASOnDemand environment. Nothing in
# HW0 needs any of it; it is here so a student can build one environment in
# September and keep it all term.
full = [
    "cs1090a-hw0[ai-tools]",
    # analysis
    "seaborn>=0.13.2",
    "scikit-learn>=1.7",
    "statsmodels",
    "tqdm",
    # data I/O and web
    "requests",
    "beautifulsoup4",
    "lxml",
    "httpx>=0.28",
    "aiohttp",
    "pyarrow>=21",
    "openpyxl",
    "duckdb>=1.5",
    "polars>=1.40",
    "plotly>=6.0",
    # notebook tooling
    "ipywidgets",
    "jupytext",
    "jupyterlab-git",
    "nbdime",
    # modelling and interpretability
    "pymc",
    "arviz",
    "xgboost",
    "imbalanced-learn",
    "lime",
    "wikipedia",
    "prettytable",
    "eli5",
    "dtreeviz",
    # `graphviz` here is only the Python binding. Rendering also needs the
    # Graphviz system package (the `dot` binary), which pip cannot install --
    # `brew install graphviz`, `apt install graphviz`, or equivalent.
    "graphviz",
]
